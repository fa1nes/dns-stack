
server:
    interface: 127.0.0.1@5335
    interface: ::1@5335
    port: 5335

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    val-permissive-mode: no

    val-log-level: 1

    unwanted-reply-threshold: 10000000

    harden-glue: yes                # 丢弃权威区外的胶水记录(防越界注入)
    harden-dnssec-stripped: yes     # 已签名区的应答若缺 DNSSEC 记录则视为攻击
    harden-below-nxdomain: yes      # NXDOMAIN 之下的名字直接判定不存在
    harden-large-queries: yes       # 丢弃超大查询(放大攻击的常见前置)
    harden-short-bufsize: yes       # 忽略过小的 EDNS 通告值

    qname-minimisation: yes

    prefetch: yes
    prefetch-key: yes

    serve-expired: yes
    serve-expired-ttl: 604800
    serve-expired-client-timeout: 1800

    client-subnet-always-forward: no

    infra-host-ttl: 3600

    serve-expired-reply-ttl: 30

    extended-statistics: yes

    aggressive-nsec: yes

    edns-buffer-size: 1232

    hide-identity: yes
    hide-version: yes
    identity: "dns"
    version: "unknown"

    msg-cache-size: 128m
    rrset-cache-size: 256m
    cache-min-ttl: 0
    cache-max-ttl: 86400
    cache-max-negative-ttl: 3600
    neg-cache-size: 4m

    num-threads: 2
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    so-reuseport: yes

    so-rcvbuf: 4m
    so-sndbuf: 4m

    outgoing-range: 4096
    num-queries-per-thread: 2048

    ratelimit: 1000

    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse
{{CN_WG_INTERFACE}}

    username: "unbound"
    directory: "/etc/unbound"
    logfile: "/var/log/dns-stack/unbound.log"
    verbosity: 1

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    server-key-file: "/etc/unbound/dns-stack_server.key"
    server-cert-file: "/etc/unbound/dns-stack_server.pem"
    control-key-file: "/etc/unbound/dns-stack_control.key"
    control-cert-file: "/etc/unbound/dns-stack_control.pem"
