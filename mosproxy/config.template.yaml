# template-rev: 10

log:
  queries: true

api:
  addr: "127.0.0.1:8888"

servers:
  - tag: "doh-in"
    protocol: "https"
    listen: "0.0.0.0:{{DOH_PORT}}"
    tls:
      certs: ["{{TLS_CERT_PATH}}"]
      keys: ["{{TLS_KEY_PATH}}"]
    http:
      path: "{{DOH_PATH}}"

  - tag: "doh3-in"
    protocol: "http3"
    listen: "0.0.0.0:{{DOH_PORT}}"
    tls:
      certs: ["{{TLS_CERT_PATH}}"]
      keys: ["{{TLS_KEY_PATH}}"]
    http:
      path: "{{DOH_PATH}}"

  - tag: "dot-in"
    protocol: "tls"
    listen: "0.0.0.0:{{DOT_PORT}}"
    tls:
      certs: ["{{TLS_CERT_PATH}}"]
      keys: ["{{TLS_KEY_PATH}}"]

  - tag: "doq-in"
    protocol: "quic"
    listen: "0.0.0.0:{{DOT_PORT}}"
    tls:
      certs: ["{{TLS_CERT_PATH}}"]
      keys: ["{{TLS_KEY_PATH}}"]

cache:
  mem_size: 67108864
  maximum_ttl: 3600
  prefetch_threshold: 0.25
  optimistic_ttl: 604800

ecs:
  enabled: true
  forward: true
  ip_zone:
    - /var/lib/dns-stack/ecs-ip-zone.txt

strip_ech: true

upstreams:
  - tag: "local-unbound"
    addr: "127.0.0.1:5335"
    health_check:
      max_fails: 5
      ping_interval: 30

  - tag: "foreign-hk"
    addr: "10.100.0.3:5335"
    health_check:
      max_fails: 5
      ping_interval: 30

load_balancers:
  - tag: "recursive-lb"
    method: "fall_through"
    backends:
      - tag: "local-unbound"
      - tag: "foreign-hk"

domain_sets:
  - tag: "blocklist-domains"
    files:
      - "/var/lib/dns-stack/blocklist.txt"

  - tag: "manual-exclude-domains"
    files:
      - "/var/lib/dns-stack/manual-exclude.txt"

  - tag: "manual-gfw-domains"
    files:
      - "/var/lib/dns-stack/manual-gfw.txt"

rules:
  - domain: "blocklist-domains"
    reject: 3
  - domain: "manual-exclude-domains"
    forward: "recursive-lb"
  - domain: "manual-gfw-domains"
    forward: "foreign-hk"
  - forward: "recursive-lb"

middleware:
  - type: "limit"
    concurrent: {{LIMIT_CONCURRENT}}
    qps: {{LIMIT_QPS}}
