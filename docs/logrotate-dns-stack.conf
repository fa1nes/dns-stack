
/var/log/dns-stack/unbound.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0644 unbound unbound
    su root unbound
    postrotate
        /usr/sbin/unbound-control -c /etc/unbound/unbound.conf log_reopen >/dev/null 2>&1 || true
    endscript
}

/var/log/dns-stack/helper.log /var/log/dns-stack/dns-stack.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
    postrotate
        chmod 0640 /var/log/dns-stack/helper.log /var/log/dns-stack/dns-stack.log 2>/dev/null || true
    endscript
}
