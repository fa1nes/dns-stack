name: geoip

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  ASN_URL: https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-ASN.mmdb
  CITY_URL: https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-City.mmdb
  CNIP_URL: https://github.com/nmgliangwei/qqwry.ipdb/releases/latest/download/qqwry.ipdb
  ASN_MIN_BYTES: "3000000"
  CITY_MIN_BYTES: "20000000"
  CNIP_MIN_BYTES: "20000000"
  DBIP_MIN_BYTES: "3000000"
  RELEASE_TAG: geoip-latest

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          gate() {
            local name="$1" min="$2" out="dist/$1"
            local size
            size="$(stat -c%s "$out")"
            if [ "$size" -lt "$min" ]; then
              echo "$name is $size bytes, below the $min gate; treating as an invalid download" >&2
              exit 1
            fi
            echo "$name $size bytes"
          }
          fetch() {
            curl -fsSL --retry 3 --retry-delay 5 --max-time 600 -o "dist/$1" "$2"
            gate "$1" "$3"
          }
          fetch GeoLite2-ASN.mmdb "$ASN_URL" "$ASN_MIN_BYTES"
          fetch GeoLite2-City.mmdb "$CITY_URL" "$CITY_MIN_BYTES"
          fetch qqwry.ipdb "$CNIP_URL" "$CNIP_MIN_BYTES"

          month="$(date -u +%Y-%m)"
          previous="$(date -u -d '1 month ago' +%Y-%m)"
          dbip() {
            local kind="$1" target="$2"
            for stamp in "$month" "$previous"; do
              if curl -fsSL --retry 2 --max-time 600 \
                   -o "dist/${target}.gz" \
                   "https://download.db-ip.com/free/dbip-${kind}-lite-${stamp}.mmdb.gz"; then
                gzip -df "dist/${target}.gz"
                echo "dbip ${kind} from ${stamp}"
                return 0
              fi
            done
            echo "dbip ${kind}: neither ${month} nor ${previous} is published" >&2
            return 1
          }
          dbip asn dbip-asn.mmdb
          dbip country dbip-city.mmdb
          gate dbip-asn.mmdb "$DBIP_MIN_BYTES"
          gate dbip-city.mmdb "$DBIP_MIN_BYTES"

          if [ -n "${IPINFO_TOKEN:-}" ]; then
            curl -fsSL --retry 3 --max-time 600 -o dist/ipinfo-lite.mmdb \
              "https://ipinfo.io/data/free/country_asn.mmdb?token=${IPINFO_TOKEN}"
            gate ipinfo-lite.mmdb "$DBIP_MIN_BYTES"
            echo "ipinfo=yes" >> "$GITHUB_ENV"
          else
            echo "IPINFO_TOKEN 未配置，跳过 IPinfo Lite（其余数据源不受影响）"
            echo "ipinfo=no" >> "$GITHUB_ENV"
          fi
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: probe known addresses
        run: |
          set -Eeuo pipefail
          go build -trimpath -buildvcs=false -o ./dns-stack ./cmd/dns-stack
          verify() {
            local kind="$1" file="$2"
            if [ ! -s "$file" ]; then
              echo "::warning::$file 不存在或为空，跳过 $kind 校验"
              return 0
            fi
            ./dns-stack geoip-verify --kind "$kind" --file "$file" \
              || { echo "::error::$kind 校验失败: $file"; exit 1; }
          }
          verify asn       dist/GeoLite2-ASN.mmdb
          verify city      dist/GeoLite2-City.mmdb
          verify cnip      dist/qqwry.ipdb
          verify dbip_asn  dist/dbip-asn.mmdb
          verify dbip_city dist/dbip-city.mmdb
          verify ipinfo    dist/ipinfo-lite.mmdb

      - name: checksums
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum ./*.mmdb ./*.ipdb > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: geoip-latest
          files: dist/*
          fail_on_unmatched_files: true
