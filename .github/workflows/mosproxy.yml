name: mosproxy

on:
  push:
    branches: [main, master]
    paths:
      - "patches/mosproxy-commits/**"
      - "versions.lock"
      - ".github/workflows/mosproxy.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: mosproxy-latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: resolve pinned upstream and patch series
        id: lock
        run: |
          set -Eeuo pipefail
          source scripts/mosproxy-artifact-common.sh
          pin="$(mosproxy_lock_value . pinned_commit)"
          repo="$(mosproxy_lock_value . repo)"
          version="$(mosproxy_expected_version .)"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pinned=$pin repo=$repo version=$version"

      - name: clone upstream and apply patches
        run: |
          set -Eeuo pipefail
          git clone -q "${{ steps.lock.outputs.repo }}" src
          git -C src checkout -q --detach "${{ steps.lock.outputs.pin }}"
          for patch in patches/mosproxy-commits/*.patch; do
            git -C src apply --check "../$patch"
            git -C src apply "../$patch"
          done
          git -C src diff --check

      - name: upstream tests
        run: cd src && go test ./...

      - name: build
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            name="mosproxy-linux-${arch}"
            (cd src && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=${{ steps.lock.outputs.version }}" \
              -o "../dist/${name}" .)
            chmod 0755 "dist/${name}"
            printf '%s\n' "${{ steps.lock.outputs.version }}" > "dist/${name}.build-id"
            (cd dist && sha256sum "${name}" > "${name}.sha256")
          done

      - name: verify embedded fingerprint
        run: |
          set -Eeuo pipefail
          want='${{ steps.lock.outputs.version }}'
          for arch in amd64 arm64; do
            if ! strings "dist/mosproxy-linux-${arch}" | grep -qF "$want"; then
              echo "mosproxy-linux-${arch} does not carry $want" >&2
              exit 1
            fi
          done
          echo "both binaries carry $want"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
